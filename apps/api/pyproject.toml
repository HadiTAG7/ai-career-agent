[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-career-agent-api"
version = "0.1.0"
description = "Evidence-first API for AI Career Agent"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.3,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6",
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.115,<1",
  "fpdf2>=2.8.4,<3",
  "brotli>=1.1,<2",
  "openai>=2.30,<3",
  "pydantic-settings>=2.6,<3",
  "pyjwt[crypto]>=2.9,<3",
  "pypdf>=5.1,<7",
  "python-multipart>=0.0.17,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
  "uharfbuzz>=0.50,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/career_agent_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# FastAPI intentionally evaluates Depends/Query markers in signatures.
ignore = ["B008"]

[tool.coverage.run]
source = ["career_agent_api"]
branch = true
