# Free staging infrastructure for the API tier. The free Postgres database expires
# after 30 days, so use test data until the PDPL/data-transfer review and a durable
# production plan are approved. The Next.js application is deployed on Vercel.
previews:
  generation: "off"

services:
  - type: web
    name: ai-career-agent-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: apps/api
    buildCommand: pip install .
    # Free services do not support pre-deploy commands. With one free instance,
    # running idempotent Alembic migrations before Uvicorn is safe for staging.
    startCommand: alembic upgrade head && uvicorn career_agent_api.main:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-career-agent-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: AI_PROVIDER
        value: mistral
      - key: MISTRAL_API_KEY
        sync: false
      - key: AI_MODEL
        value: mistral-small-2603
      - key: AI_SAFETY_SALT
        generateValue: true

databases:
  - name: ai-career-agent-postgres
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    databaseName: career_agent
    user: career_agent
    ipAllowList: []
