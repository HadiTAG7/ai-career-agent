# Production-candidate infrastructure for the API tier. Do not attach real user
# data until the PDPL/data-transfer assessment in docs/privacy-and-platform-policy.md
# is approved. The Next.js application is deployed separately on Vercel.
previews:
  generation: "off"

services:
  - type: web
    name: ai-career-agent-api
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: apps/api
    buildCommand: pip install .
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn career_agent_api.main:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-career-agent-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: ai-career-agent-queue
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: ai-career-agent-queue
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_AUDIENCE
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: AI_PROVIDER
        value: deterministic

  - type: worker
    name: ai-career-agent-worker
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: apps/api
    buildCommand: pip install .
    startCommand: celery -A career_agent_api.worker:celery_app worker --loglevel=INFO
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-career-agent-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: ai-career-agent-queue
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: ai-career-agent-queue
          type: keyvalue
          property: connectionString
      - key: AI_PROVIDER
        value: deterministic

  - type: keyvalue
    name: ai-career-agent-queue
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: ai-career-agent-postgres
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: career_agent
    user: career_agent
    ipAllowList: []
