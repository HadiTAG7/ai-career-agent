name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API lint, tests, and migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck (advisory)
        # Advisory until the existing findings are burned down; it must not block PRs yet.
        continue-on-error: true
        run: python -m pip install mypy && python -m mypy src --ignore-missing-imports --no-strict-optional
      - name: Test
        run: python -m pytest
      - name: Apply migrations to an empty database
        env:
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+aiosqlite:///./ci-migration.db"
          AUTO_CREATE_SCHEMA: "false"
        run: alembic upgrade head && alembic check && alembic downgrade base

  web:
    name: Web lint, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # New advisories in the transitive tree must stay visible without turning
    # unrelated PRs red. continue-on-error is not enough: the job still reports a
    # failed check, and Render's checksPass auto-deploy then never fires. Keep the
    # job itself green and surface advisories as a warning annotation instead.
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Audit dependencies
        run: |
          npm audit --audit-level=high \
            || echo "::warning title=Dependency advisories::npm audit reported high-severity advisories; review them."

  compose:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare safe local configuration
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check public health endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the temporary stack
        if: always()
        run: docker compose down --volumes --remove-orphans
